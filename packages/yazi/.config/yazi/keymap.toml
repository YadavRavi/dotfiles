# Deltas from Yazi's built-in keymap ONLY — prepend_keymap wins over defaults.
# Reference: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml

# Keep the pre-25.x muscle memory: z = zoxide, Z = fzf (upstream swapped them).
[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"
