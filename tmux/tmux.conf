# =============================================================================
# tmux.conf — Workman-DHK yneo navigation
# =============================================================================
# Prefix: Ctrl+Space (avoids Ctrl+B conflicts with neovim/Claude Code)
# Navigation: yneo (y=up, n=down, e=left, o=right)
# Theme: Catppuccin Mocha
# =============================================================================

# --- General Settings --------------------------------------------------------

set -g default-terminal "tmux-256color"
# Terminal-specific overrides (Ghostty, iTerm2, etc.) are in local.conf
set -sg escape-time 10                    # Fast ESC for vi mode + Alt keys
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-clipboard on                   # OSC 52 clipboard
set -g base-index 1                       # Windows start at 1
set -g pane-base-index 1                  # Panes start at 1
set -g renumber-windows on                # Renumber on close
set -g detach-on-destroy off              # Switch session on destroy (sesh)

# --- Prefix ------------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Layer 1: Prefix-Free (Alt+key) -----------------------------------------
# Identical to former Zellij global bindings

# Pane focus (yneo)
bind -n M-y select-pane -U
bind -n M-n select-pane -D
bind -n M-e select-pane -L
bind -n M-o select-pane -R

# New pane (vertical split)
bind -n M-w split-window -h -c "#{pane_current_path}"

# Resize
bind -n M-= resize-pane -U 2
bind -n M-- resize-pane -D 2

# Toggle popup window
bind -n M-f display-popup -d "#{pane_current_path}" -w 80% -h 80% -E

# Swap window position
bind -n M-, swap-window -t -1\; select-window -t -1
bind -n M-. swap-window -t +1\; select-window -t +1

# --- Layer 2: Prefix (Ctrl+Space) -------------------------------------------

# Splits
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind p previous-window

# Pane focus with prefix (yneo)
bind y select-pane -U
bind n select-pane -D
bind e select-pane -L
bind o select-pane -R

# Pane resize with prefix (yneo)
bind -r Y resize-pane -U 5
bind -r N resize-pane -D 5
bind -r E resize-pane -L 5
bind -r O resize-pane -R 5

# Session picker (sesh + fzf)
# Leading `echo " ";` is a workaround for a tmux display-popup ↔ fzf TTY
# race: fzf opens /dev/tty before tmux finishes setting up the popup's PTY
# and exits immediately on its first probe. Writing a byte to the popup PTY
# before invoking fzf primes the terminal state and avoids the race. A bare
# `sleep` doesn't help — there must be actual I/O to the popup. Seen with
# tmux 3.6a + fzf 0.71.0 on macOS 26.
bind T display-popup -E -w 60% -h 60% "echo ' '; #{@dotfiles_path}/tmux/scripts/sesh-picker.sh"

# Last session
bind L run-shell "sesh last"

# --- Copy Mode (vi + yneo) --------------------------------------------------

setw -g mode-keys vi

# Enter copy mode
bind '[' copy-mode

# yneo navigation in copy mode
bind -T copy-mode-vi y send-keys -X cursor-up
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-left
bind -T copy-mode-vi o send-keys -X cursor-right

# Page/half-page scrolling (yneo)
bind -T copy-mode-vi C-y send-keys -X scroll-up
bind -T copy-mode-vi C-n send-keys -X scroll-down
bind -T copy-mode-vi u send-keys -X halfpage-up
bind -T copy-mode-vi d send-keys -X halfpage-down

# Search
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# Selection and copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@clipboard_cmd}"

# Word, line, paragraph motions (yneo-compatible — no hjkl remaps needed)
bind -T copy-mode-vi w send-keys -X next-word
bind -T copy-mode-vi b send-keys -X previous-word
bind -T copy-mode-vi W send-keys -X next-space
bind -T copy-mode-vi B send-keys -X previous-space-end
bind -T copy-mode-vi 0 send-keys -X start-of-line
bind -T copy-mode-vi '$' send-keys -X end-of-line
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom

# --- Catppuccin Theme --------------------------------------------------------

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "default"

# Status bar layout
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M"

# Window status
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# --- Session Persistence -----------------------------------------------------

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins (TPM) -----------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Machine-specific overrides (gitignored, generated by setup.sh)
source-file -q ~/.config/tmux/local.conf

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
